name: Deploy to adm.tools

on:
  push:
    branches: [ main ]
  pull_request:
    types: [closed]
    branches: [ main ]

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}    # або SSH_PRIVATE_KEY — як ти назвав секрет
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            APP_DIR="/home/yvjmk/webtechportfolio.website/www"
            REPO_URL="https://github.com/Romaleso261981/technoAI2.git"   # <-- твій репозиторій

            mkdir -p "$APP_DIR"

            if [ -d "$APP_DIR/.git" ]; then
              echo "Repo exists -> update"
              git -C "$APP_DIR" fetch --all
              git -C "$APP_DIR" reset --hard origin/main || git -C "$APP_DIR" pull --ff-only
            else
              echo "Repo not found -> clone"
              git clone "$REPO_URL" "$APP_DIR"
              git -C "$APP_DIR" checkout main || true
            fi

            # тут можна додати збірку/рестарт (якщо треба)
            # npm --prefix "$APP_DIR" ci
            # npm --prefix "$APP_DIR" run build
            # pm2 restart your-app || true
