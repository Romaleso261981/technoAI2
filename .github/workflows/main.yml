name: Deploy to adm.tools

on:
  push:
    branches: [ main ]          # деплой на кожен пуш у main
  pull_request:
    types: [closed]             # і коли PR у main закритий
    branches: [ main ]

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}          # або SSH_PRIVATE_KEY — залежить від того, як назвав секрет
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/yvjmk/webtechportfolio.website/www
            git fetch --all
            git reset --hard origin/main || git pull --ff-only

            # якщо потрібно додати побудову або рестарт процеса:
            # npm ci
            # npm run build
            # pm2 restart your-app

